[package]
name = "spdystream-rs"
version = "0.1.1"
edition = "2021"
description = "SPDY/3.1 stream multiplexer for Kubernetes CRI runtimes"
license = "Apache-2.0"
repository = "https://github.com/pelagos-containers/spdystream-rs"
keywords = ["spdy", "kubernetes", "cri", "multiplexer"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
flate2 = { version = "1", features = ["zlib-rs"] }
http = "1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
